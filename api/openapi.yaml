  "components": {
    "securitySchemes": {
      "DevelopmentBearer": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "MemoryHub development HMAC token"
      }
    },
    "schemas": {
      "Seq": {
        "type": "string",
        "pattern": "^[0-9]+$",
        "description": "64-bit integer encoded as a decimal string"
      },
      "Error": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "error": {
            "type": "string"
          }
        },
        "required": [
          "error"
        ]
      },
      "Timing": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "schema_version": {
            "type": "integer",
            "const": 1
          },
          "origin_id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "boot_id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "clock_segment_id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "stream_seq": {
            "$ref": "#/components/schemas/Seq"
          },
          "monotonic_ns": {
            "$ref": "#/components/schemas/Seq"
          },
          "source_time": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "calibration_ref": {
            "type": [
              "string",
              "null"
            ]
          },
          "causal_parent_event_ids": {
            "type": "array",
            "items": {
              "type": "string",
              "minLength": 1,
              "maxLength": 128
            },
            "maxItems": 16
          }
        },
        "required": [
          "schema_version",
          "origin_id",
          "boot_id",
          "clock_segment_id",
          "stream_seq",
