    "/v1/demo/session": {
      "post": {
        "operationId": "demoSession",
        "description": "Opt-in local development only (WEB_DEMO_ENABLED=true). Issues a short-lived account/device/page-bound credential. Explicit development accounts are provisioned on connection in tenant demo; omitted user_id preserves seeded demo-user behavior. Browser cross-site requests are rejected and revoked devices remain revoked. This is not production account login.",
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/DemoSessionRequest"
              }
            }
