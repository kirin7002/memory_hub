          }
        }
      }
    },
    "/v1/demo/chat": {
      "post": {
        "operationId": "demoChat",
        "description": "Opt-in server-held model proxy. Persists input, claims a device Run, assembles context, calls the configured model and persists the reply before responding. Completed requests are cached per user/device/request_id for 10 minutes in this process; not durable across restarts. Changed request payload or in-progress duplicate returns 409; model unavailable 503, cache capacity 429. No automatic paid retry.",
        "security": [
          {
            "DevelopmentBearer": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/DemoChatRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DemoChatResponse"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    }
