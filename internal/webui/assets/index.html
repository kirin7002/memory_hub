<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MemoryHub · 对话</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <aside id="sidebar" class="sidebar">
    <button id="close-chats" class="mobile-control close-chats" aria-label="关闭会话列表">×</button>
    <a class="brand" href="/"><span class="brand-mark">m.</span><span>MemoryHub<small>你的随行助手</small></span></a>
    <button id="new-chat" class="new-chat"><span>＋</span> 新对话</button>
    <a class="separate-client-link" href="/client" target="_blank" rel="noopener">打开独立多端客户端 ↗</a>
    <div class="sidebar-heading">最近对话 <button id="refresh" class="icon-button" aria-label="刷新会话" title="刷新会话">↻</button></div>
    <nav id="conversation-list" aria-label="会话列表"></nav>
    <div class="sidebar-footer"><span class="online-dot" id="global-dot"></span><div><span id="global-status">正在连接</span><small id="model-name">正在获取模型配置</small></div></div>
  </aside>
  <main class="chat-workspace">
    <header class="chat-header">
      <div class="chat-heading"><h1 id="session-title">新对话</h1><span id="session-kind">和助手聊聊你的想法</span></div>
      <div class="header-actions">
        <button id="show-chats" class="mobile-control" aria-label="打开会话列表">☰ 会话</button>
        <div class="device-switch" role="group" aria-label="当前设备身份">
          <button id="device-phone" data-device="phone" aria-pressed="true">▯ 手机端</button>
          <button id="device-car" data-device="car" aria-pressed="false">▱ 车端</button>
        </div>
        <button id="toggle-context" class="context-toggle" aria-expanded="false" aria-controls="context-panel">◈ 上下文</button>
      </div>
    </header>
    <div class="chat-body">
      <section class="conversation-pane" aria-label="对话">
        <div id="messages" class="messages" role="log" aria-label="聊天记录" aria-live="polite" aria-relevant="additions"></div>
        <div class="input-area">
          <div id="chat-error" class="chat-error" role="alert" hidden><span id="error-text"></span><button id="dismiss-error" aria-label="关闭错误提示">×</button></div>
          <div class="composer-topline"><span id="device-description">从手机端发送</span><label id="task-label" for="task-type">对话类型 <select id="task-type"><option value="chat">日常对话</option><option value="trip_planning">行程规划</option></select></label><span id="turn-status"></span></div>
          <form id="chat-form" class="composer">
            <textarea id="chat-input" aria-label="消息" placeholder="发送消息，开始一段对话…" rows="2" maxlength="32768"></textarea>
            <div class="composer-bottom"><span>Enter 发送 · Shift + Enter 换行</span><button id="send" type="submit" class="send-button" aria-label="发送消息">↑</button></div>
          </form>
          <p id="sync-summary" class="composer-note">正在连接 MemoryHub…</p>
        </div>
      </section>
      <aside id="context-panel" class="context-panel" aria-label="会话上下文" hidden>
        <div class="panel-heading"><div><span class="eyebrow">MEMORYHUB</span><h2>会话上下文</h2></div><button id="close-context" class="icon-button" aria-label="关闭上下文">×</button></div>
        <p class="panel-intro">每次回复前，助手从这里读取当前任务和会话历史。</p>
        <section class="context-card"><h3>当前任务 <span id="context-status">尚未开始</span></h3><div id="context-values" class="context-values"></div><div id="proposals" class="proposals" aria-label="待确认信息" hidden></div></section>
        <section class="context-card"><h3>共享历史</h3><strong id="history-count" class="history-count">0 条消息</strong><p>切换到另一端，继续同一个会话。</p><div class="replica-status"><span id="phone-status">手机 · 连接中</span><span id="car-status">车端 · 连接中</span></div></section>
        <details class="session-details"><summary>连接信息</summary><dl><dt>会话 ID</dt><dd id="detail-conversation">—</dd><dt>上下文 ID</dt><dd id="detail-context">—</dd><dt>上下文版本</dt><dd id="detail-version">—</dd><dt>存储</dt><dd>MemoryHub / PostgreSQL</dd></dl></details>
      </aside>
    </div>
  </main>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
