services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: memoryhub
      POSTGRES_PASSWORD: memoryhub_dev
      POSTGRES_DB: memoryhub
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - memoryhub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoryhub -d memoryhub"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  memoryhub_pgdata:
